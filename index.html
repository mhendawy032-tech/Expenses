 else if("÷×−+".includes(k)){fr=false;if(!ex)ex=k==="−"?"-":"";else if(OPS.includes(ex.slice(-1)))ex=ex.slice(0,-1)+k;else ex+=k}
 else{if(fr){ex="";fr=false}if(k==="."&&/\.[0-9]*$/.test(ex))return;if(/^[0-9]$/.test(k)&&/(^|[^0-9.])0$/.test(ex))ex=ex.slice(0,-1);ex+=k}
 ckr()}
